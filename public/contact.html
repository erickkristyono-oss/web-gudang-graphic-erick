<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Gudang Graphic</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="images/logo gudang graphic.png" alt="Gudang Graphic">
            <h1>Gudang Graphic</h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="product.html">Products/Services</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="nav-actions">
            <a href="cart.html" class="btn-cart">🛒 Cart</a>
            <a href="login.html" class="btn-login">Login</a>
        </div>
    </nav>

    <main class="container">
        <div class="form-box">
            <form action="#">
                <div class="input-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>
                <div class="input-group">
                    <label for="message">Pesan / Detail Proyek</label>
                    <textarea id="message" rows="5" placeholder="Ceritakan detail desain yang Anda butuhkan..."
                        required></textarea>
                </div>
                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </div>
    </main>

</body>

</html>
