<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Gudang Graphic</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="images/logo gudang graphic.png" alt="Gudang Graphic">
            <h1>Gudang Graphic</h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="product.html">Products/Services</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
        <div class="nav-actions">
            <a href="cart.html" class="btn-cart">🛒 Cart</a>
            <a href="login.html" class="btn-login">Login</a>
        </div>
    </nav>
    <main class="container">
        <div class="form-box">
            <h2 style="text-align: center; color: var(--primary-blue); margin-bottom: 20px;">Daftar Akun Baru</h2>

            <form action="/register" method="POST">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Buat password baru" required>
                </div>
                <button type="submit" class="btn-submit">Register</button>
            </form>

            <p style="text-align: center; margin-top: 20px;">
                Sudah punya akun? <a href="/login.html" style="color: var(--light-tosca);">Masuk di sini</a>
            </p>
        </div>
    </main>
</body>

</html>
